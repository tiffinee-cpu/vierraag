<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark background for contrast -->
  <circle cx="50" cy="50" r="50" fill="#2A1F14"/>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#B8943F" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="#B8943F" stroke-width="1"/>
  <!-- Horizon line -->
  <line x1="18" y1="65" x2="82" y2="65" stroke="#B8943F" stroke-width="1" opacity="0.6"/>
  <!-- Vineyard perspective lines -->
  <line x1="50" y1="36" x2="20" y2="64" stroke="#B8943F" stroke-width="0.8" opacity="0.45"/>
  <line x1="50" y1="36" x2="34" y2="64" stroke="#B8943F" stroke-width="0.8" opacity="0.45"/>
  <line x1="50" y1="36" x2="66" y2="64" stroke="#B8943F" stroke-width="0.8" opacity="0.45"/>
  <line x1="50" y1="36" x2="80" y2="64" stroke="#B8943F" stroke-width="0.8" opacity="0.45"/>
  <circle cx="50" cy="36" r="1.5" fill="#B8943F" opacity="0.6"/>
  <!-- Agave rosette (left) -->
  <g transform="translate(28,57)">
    <line x1="0" y1="0" x2="-8" y2="-12" stroke="#6B7A5E" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-11" y2="-4" stroke="#6B7A5E" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="8"  y2="-12" stroke="#6B7A5E" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="11" y2="-4"  stroke="#6B7A5E" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0"  y2="-14" stroke="#6B7A5E" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2" fill="#6B7A5E"/>
  </g>
  <!-- Tree (right) -->
  <g transform="translate(70,37)">
    <path d="M0,27 C-1,19 1,12 0,5" stroke="#8C6B52" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="3" rx="11" ry="9" fill="#4A5C40" opacity="0.85"/>
    <ellipse cx="-6" cy="8" rx="7" ry="5" fill="#4A5C40" opacity="0.75"/>
    <ellipse cx="6"  cy="8" rx="7" ry="5" fill="#4A5C40" opacity="0.75"/>
  </g>
</svg>
